[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-skill"
version = "0.2.0"
description = "Lightweight task-level workflow control for multi-step Agent skills"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Vayi" }]
dependencies = []

[project.scripts]
flow-skill = "flow_skill.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

